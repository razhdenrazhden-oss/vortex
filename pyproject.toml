[project]
name = "activity-load-tracker"
version = "0.1.0"
description = "MVP backend for tracking activity load metrics (ATL/CTL/TSB/readiness)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
