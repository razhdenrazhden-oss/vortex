services:
  - type: web
    name: vortex-backend
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: STARTUP_DB_INIT
        value: "false"
      - key: ENABLE_DAILY_SYNC_LOOP
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: INTERVALS_API_TOKEN
        sync: false

cronJobs:
  - name: vortex-daily-sync
    schedule: "0 3 * * *"
    env: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python scripts_render_sync.py
