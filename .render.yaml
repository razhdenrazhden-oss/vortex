services:
  - type: web
    name: vortex-backend
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: INTERVALS_API_TOKEN
        sync: false

cronJobs:
  - name: vortex-daily-sync
    schedule: "0 3 * * *"
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: "curl -X POST $RENDER_EXTERNAL_URL/update-data"
